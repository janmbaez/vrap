name: Build and publish VRAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --format=json --output pip-audit.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
        working-directory: frontend
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            frontend/npm-audit.json
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      VRAP_TEST_DATABASE_URL: postgresql+psycopg://vrap_test@127.0.0.1:5432/vrap_migration_test
      VRAP_CAMPAIGN_DATABASE_URL: postgresql+psycopg://vrap_test@127.0.0.1:5432/vrap_campaign_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vrap_test
          POSTGRES_DB: vrap_migration_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vrap_test -d vrap_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest
      - name: Prepare isolated campaign test database
        run: python -c "import psycopg; connection = psycopg.connect('host=127.0.0.1 user=vrap_test dbname=postgres', autocommit=True); connection.execute('CREATE DATABASE vrap_campaign_test'); connection.close()"
      - run: PYTHONPATH=. pytest -q tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  publish:
    # Image publication is explicit. A merge to main never changes a deployed environment.
    if: github.event_name == 'workflow_dispatch'
    needs: [security, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            shyhotboy/vrap-api:latest
            shyhotboy/vrap-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            shyhotboy/vrap-web:latest
            shyhotboy/vrap-web:${{ github.sha }}
      - name: Promotion boundary
        run: echo 'Images published. Deploy through an approved staging or production promotion runbook.'
